<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingron Deriv Trader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Kingron Deriv Trader</h1>

<button id="connect">Connect to Deriv</button>
<button id="logout">Logout</button>

<p id="status">Ready to connect to Deriv API</p>

<p>Balance: <span id="balance">--</span></p>
<p>Account ID: <span id="accountId">--</span></p>

<h3>Live Market</h3>
<p>Volatility 100 Index: <span id="tick">Waiting...</span></p>

<h3>Debug Log</h3>
<pre id="debug" style="text-align:left; font-size:12px; white-space:pre-wrap; border:1px solid #ccc; padding:10px;"></pre>

<script src="script.js"></script>

</body>
</html>
