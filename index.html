<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingron - Deriv Trader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Kingron Deriv Trader</h1>

    <!-- Login Button -->
    <button id="loginBtn" class="btn" onclick="login()">Log In with Deriv</button>

    <!-- User Account Details (hidden until login) -->
    <div class="card" id="userInfo" style="display: none;">
        <h3>Account Status</h3>
        <p><strong>Account ID:</strong> <span id="accountId">-</span></p>
        <p><strong>Balance:</strong> <span id="balance">-</span></p>
    </div>

    <!-- Live Market Stream -->
    <div class="card">
        <h3>Live Volatility 100 Index (R_100)</h3>
        <div class="tick-display" id="tickPrice">Connecting...</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
