<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingron - Deriv Trader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { margin-top: 0; color: #ff444f; }
        .btn {
            background-color: #ff444f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-bottom: 20px;
        }
        .btn:hover { background-color: #e63946; }
        .card {
            background: #262626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .tick-display {
            font-size: 28px;
            font-weight: bold;
            color: #4caf50;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kingron Deriv Trader</h1>

    <!-- Login Button -->
    <button id="loginBtn" class="btn" onclick="login()">Log In with Deriv</button>

    <!-- User Account Details -->
    <div class="card" id="userInfo" style="display: none;">
        <h3>Account Status</h3>
        <p><strong>Account ID:</strong> <span id="accountId">-</span></p>
        <p><strong>Balance:</strong> <span id="balance">-</span></p>
    </div>

    <!-- Live Market Stream -->
    <div class="card">
        <h3>Live Volatility 100 Index (R_100)</h3>
        <div class="tick-display" id="tickPrice">Connecting...</div>
    </div>
</div>

<script>
    // Configured with your registered App ID
    const APP_ID = '33XVY2GPVVkcJtekabSF5'; 
    const wsUrl = `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;
    const ws = new WebSocket(wsUrl);

    // 1. Handle OAuth Login
    function login() {
        const redirectUrl = encodeURIComponent(window.location.origin + window.location.pathname);
        window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${APP_ID}&l=EN`;
    }

    // 2. Extract Token from URL after OAuth Redirect
    function getTokenFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('token1'); // First account token returned by Deriv
    }

    // 3. WebSocket Connection Established
    ws.onopen = () => {
        console.log('Connected to Deriv WebSocket');

        // Keep connection active
        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ ping: 1 }));
            }
        }, 30000);

        // Check if user has returned from OAuth login
        const token = getTokenFromURL();
        if (token) {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            
            // Authorize the session with token
            ws.send(JSON.stringify({ authorize: token }));
        }

        // Subscribe to Volatility 100 Index real-time price ticks
        ws.send(JSON.stringify({ ticks: 'R_100', subscribe: 1 }));
    };

    // 4. Handle Incoming WebSocket Data
    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);

        // Authorize response (User Logged In)
        if (response.msg_type === 'authorize' && response.authorize) {
            document.getElementById('accountId').innerText = response.authorize.loginid;
            document.getElementById('balance').innerText = `${response.authorize.balance} ${response.authorize.currency}`;
        }

        // Live Market Tick updates
        if (response.msg_type === 'tick' && response.tick) {
            document.getElementById('tickPrice').innerText = response.tick.quote;
        }

        if (response.error) {
            console.error('Deriv API Error:', response.error.message);
        }
    };
</script>

</body>
</html>
